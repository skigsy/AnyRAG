[package]
name = "rust-rag"
version = "1.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
default-run = "rust-rag"
autobins = false

[[bin]]
name = "rust-rag"
path = "src/main.rs"

[features]
pdf = ["dep:lopdf", "dep:rlimit", "dep:windows-sys"]
ocr = ["dep:rustix", "dep:serde", "dep:socket2"]
docx = ["dep:roxmltree", "dep:zip", "dep:serde", "dep:rlimit", "dep:windows-sys"]
xlsx = ["dep:calamine", "dep:serde", "dep:zip", "dep:rlimit", "dep:windows-sys"]
model = ["dep:ureq", "dep:tempfile", "dep:serde"]
inference = ["model", "dep:ort", "dep:tokenizers", "dep:libloading"]
mcp = ["dep:serde", "serde_json/raw_value"]
dashboard = ["dep:getrandom", "dep:httparse", "dep:serde", "dep:subtle", "dep:tempfile", "dep:time", "dep:windows-sys", "rusqlite/hooks"]
shared = ["model", "dep:tiny_http", "dep:ring", "dep:base64", "dep:serde", "dep:tempfile", "rusqlite/backup"]
aws = ["shared", "dep:aws-config", "dep:aws-sdk-s3", "dep:aws-sdk-neptunedata", "dep:aws-smithy-types", "dep:hmac", "dep:tokio"]

[dependencies]
anyhow = "1"
calamine = { version = "=0.38.0", default-features = false, optional = true }
clap = { version = "4.6", features = ["derive"] }
aws-config = { version = "1", optional = true }
aws-sdk-neptunedata = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio"], optional = true }
aws-smithy-types = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "=0.4.3", optional = true }
hmac = { version = "0.12", optional = true }
httparse = { version = "=1.10.1", optional = true }
lopdf = { version = "=0.47.0", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "api-24"], optional = true }
ring = { version = "0.17", optional = true }
roxmltree = { version = "=0.21.2", default-features = false, features = ["std"], optional = true }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
sha2 = "0.10"
subtle = { version = "=2.6.1", optional = true }
tempfile = { version = "3", optional = true }
time = { version = "=0.3.55", optional = true }
tiny_http = { version = "0.12", optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "fs", "net", "sync", "time"], optional = true }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"], optional = true }
zip = { version = "=9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rlimit = { version = "=0.11.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["net", "process"], optional = true }
socket2 = { version = "=0.6.5", optional = true }

[target.'cfg(windows)'.dependencies]
libloading = { version = "=0.9.0", optional = true }
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
