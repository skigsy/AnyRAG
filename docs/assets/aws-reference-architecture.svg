<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="772" viewBox="0 0 1280 772" role="img" aria-labelledby="title desc">
<title id="title">Private AWS reference</title>
<desc id="desc">Team clients reach a private HTTPS load balancer with OIDC tokens. A single EC2 host runs Any RAG with SQLite on encrypted EBS. Optional Neptune receives opaque topology. Separate versioned S3 stores hold sources, current access policy and backups. The host reads its image and secrets through scoped IAM.</desc>
