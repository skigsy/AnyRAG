<svg xmlns="http://www.w3.org/2000/svg" width="960" height="526" viewBox="0 0 960 526" role="img" aria-labelledby="title desc">
  <title id="title">Any RAG building blocks</title>
  <desc id="desc">Seven mix-and-match capabilities are available to solo, team, and company setups: keyword search, PDF and Word, embeddings and reranking, cited answers, typed Graph RAG, shared access, and recovery. Describe your workload, get a recommendation, then choose the pieces you need.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1c171c"/><stop offset="1" stop-color="#0d0e11"/></linearGradient>
    <linearGradient id="face" x2="0" y2="1"><stop stop-color="#29232a"/><stop offset="1" stop-color="#19171d"/></linearGradient>
    <linearGradient id="core" x2="0" y2="1"><stop stop-color="#392823"/><stop offset="1" stop-color="#21191c"/></linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#393039"/></pattern>
    <path id="piece" d="M5 0H41V-5Q41-9 45-9H70Q74-9 74-5V0H113Q118 0 118 5V127Q118 132 113 132H5Q0 132 0 127V5Q0 0 5 0Z"/>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .headline, .audience { font-family: Georgia, "Times New Roman", serif; fill: #f5f0e8; }
      .headline { font-size: 47px; letter-spacing: -0.8px; }
      .audience { font-size: 25px; }
      .caption { font-size: 18px; fill: #c9bdb4; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #f6c279; }
      .scale { font-size: 13px; font-weight: 700; letter-spacing: 1.1px; fill: #a0b4c3; }
      .block-title { font-size: 19px; font-weight: 700; fill: #f5f0e8; }
      .block-detail { font-size: 14.5px; fill: #c9bdb4; }
      .face { fill: url(#face); stroke: #5b4b53; }
      .depth { fill: #100f14; stroke: #4c3b42; }
      .core { fill: url(#core); stroke: #c18c60; }
      .icon { fill: none; stroke: #e7ac69; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .rail { fill: none; stroke: #9c735c; stroke-width: 1.2; }
      .joint { fill: #f6c279; }
      .scope { font-size: 16px; fill: #c9bdb4; }
      .step { font-size: 17px; font-weight: 700; fill: #f5f0e8; }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="524" rx="14" fill="url(#panel)" stroke="#514446" stroke-width="2"/>
  <rect x="22" y="132" width="916" height="294" rx="6" fill="url(#grid)"/>
  <text x="34" y="34" class="eyebrow">ANY RAG / MODULAR ARCHITECTURE</text>
  <text x="32" y="87" class="headline">Build with Any RAG</text>
  <text x="34" y="118" class="caption">Start with keyword search. Add the pieces your workload needs.</text>
  <g aria-hidden="true">
    <path d="M772 77L811 50L848 70L887 42L926 60M811 50L887 42M848 70L926 60" fill="none" stroke="#705252" stroke-width="1.2"/>
    <path d="M811 50L848 70L887 42L926 60" class="icon"/>
    <circle cx="772" cy="77" r="3" fill="#a0b4c3"/><circle cx="811" cy="50" r="3" class="joint"/>
    <circle cx="848" cy="70" r="3" class="joint"/><circle cx="887" cy="42" r="3" class="joint"/>
    <circle cx="926" cy="60" r="3" fill="#a0b4c3"/>
  </g>

  <text x="34" y="156" class="scale">SIMPLE CORE</text>
  <path d="M144 151H788m-6-4 6 4-6 4" fill="none" stroke="#705252"/>
  <text x="926" y="156" class="scale" text-anchor="end">MORE SETUP</text>
  <g transform="translate(34 181)">
    <use href="#piece" class="depth" x="3" y="4"/><use href="#piece" class="core"/>
    <path class="icon" d="M13 18h16m-16 5h13m-13 5h8m10-9a4 4 0 1 0 0 8 4 4 0 0 0 0-8m3 7 4 4"/>
    <text x="13" y="56" class="block-title"><tspan x="13">Keyword</tspan><tspan x="13" dy="23">search</tspan></text>
    <text x="13" y="103" class="block-detail"><tspan x="13">Rust + SQLite</tspan><tspan x="13" dy="19">Exact passages</tspan></text>
  </g>
  <g transform="translate(163 181)">
    <use href="#piece" class="depth" x="3" y="4"/><use href="#piece" class="face"/>
    <path class="icon" d="M14 16h10l5 5v12H14zm10 0v5h5m-11 4h7m-7 4h7m7-10h4v17H18v-2"/>
    <text x="13" y="56" class="block-title"><tspan x="13">PDF</tspan><tspan x="13" dy="23">&amp; Word</tspan></text>
    <text x="13" y="103" class="block-detail"><tspan x="13">Text-layer PDF</tspan><tspan x="13" dy="19">and .docx</tspan></text>
  </g>
  <g transform="translate(292 181)">
    <use href="#piece" class="depth" x="3" y="4"/><use href="#piece" class="face"/>
    <path class="icon" d="M14 19h8m-8 6h13m-13 6h19m-7-12h1m4 6h1m-1-8 5 2-5 2"/>
    <text x="13" y="56" class="block-title"><tspan x="13">Smarter</tspan><tspan x="13" dy="23">search</tspan></text>
    <text x="13" y="103" class="block-detail"><tspan x="13">Embeddings</tspan><tspan x="13" dy="19">or reranking</tspan></text>
  </g>
  <g transform="translate(421 181)">
    <use href="#piece" class="depth" x="3" y="4"/><use href="#piece" class="face"/>
    <path class="icon" d="M14 17h22v12H23l-6 4v-4h-3zm6 5h10m-10 4h6"/>
    <text x="13" y="56" class="block-title"><tspan x="13">Cited</tspan><tspan x="13" dy="23">answers</tspan></text>
    <text x="13" y="103" class="block-detail"><tspan x="13">Local or</tspan><tspan x="13" dy="19">hosted model</tspan></text>
  </g>
  <g transform="translate(550 181)">
    <use href="#piece" class="depth" x="3" y="4"/><use href="#piece" class="face"/>
    <path class="icon" d="m18 25 7-6 8 9m-15-3 15 3"/>
    <g fill="#e7ac69"><circle cx="16" cy="26" r="2.5"/><circle cx="25" cy="18" r="2.5"/><circle cx="34" cy="29" r="2.5"/></g>
    <text x="13" y="56" class="block-title"><tspan x="13">Graph</tspan><tspan x="13" dy="23">RAG</tspan></text>
    <text x="13" y="103" class="block-detail"><tspan x="13">Follow typed</tspan><tspan x="13" dy="19">relationships</tspan></text>
  </g>
  <g transform="translate(679 181)">
    <use href="#piece" class="depth" x="3" y="4"/><use href="#piece" class="face"/>
    <path class="icon" d="M17 23h17v11H17zm4 0v-4a4.5 4.5 0 0 1 9 0v4m-4.5 4v3"/>
    <text x="13" y="56" class="block-title"><tspan x="13">Shared</tspan><tspan x="13" dy="23">access</tspan></text>
    <text x="13" y="103" class="block-detail"><tspan x="13">Sign-in and</tspan><tspan x="13" dy="19">permissions</tspan></text>
  </g>
  <g transform="translate(808 181)">
    <use href="#piece" class="depth" x="3" y="4"/><use href="#piece" class="face"/>
    <path class="icon" d="M16 24a9 9 0 1 1 2 6m-2-12v6h6m3-5v6l4 2"/>
    <text x="13" y="67" class="block-title">Recovery</text>
    <text x="13" y="103" class="block-detail"><tspan x="13">Backup</tspan><tspan x="13" dy="19">and restore</tspan></text>
  </g>

  <path d="M34 329v10h277m338 0h277v-10" class="rail"/>
  <text x="480" y="345" class="eyebrow" text-anchor="middle">THE SAME BLOCKS AT EVERY SCALE</text>
  <path d="M172 339v22m308-3v3m308-22v22" class="rail"/>
  <circle cx="172" cy="362" r="2.5" class="joint"/><circle cx="480" cy="362" r="2.5" class="joint"/><circle cx="788" cy="362" r="2.5" class="joint"/>
  <g text-anchor="middle">
    <text x="172" y="392" class="audience">Solo</text><text x="172" y="420" class="scope">Notes, documents, or local graphs</text>
    <text x="480" y="392" class="audience">Small team</text><text x="480" y="420" class="scope">Private search with access rules</text>
    <text x="788" y="392" class="audience">Company</text><text x="788" y="420" class="scope">Shared search, graph, and recovery</text>
  </g>

  <rect x="34" y="449" width="892" height="52" rx="6" fill="#201a20" stroke="#53424a"/>
  <text x="183" y="481" class="step" text-anchor="middle">Describe your workload</text>
  <path d="M316 475h31m-6-4 6 4-6 4" class="icon"/>
  <text x="480" y="481" class="step" text-anchor="middle">Get a recommended build</text>
  <path d="M613 475h31m-6-4 6 4-6 4" class="icon"/>
  <text x="777" y="481" class="step" text-anchor="middle">Add or swap blocks</text>
</svg>
