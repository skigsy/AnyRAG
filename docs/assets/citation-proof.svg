<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
  <title id="title">From a question to a reopened citation</title>
  <desc id="desc">The question asks where the workshop spare key is. The exact passage identifies locker 14. AnyRAG reopened workshop.md at revision 138222d1c030, characters 0 to 52.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1c171c"/><stop offset="1" stop-color="#0d0e11"/></linearGradient>
    <linearGradient id="quote" x2="1" y2="1"><stop stop-color="#30221f"/><stop offset="1" stop-color="#20191c"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="958" height="288" rx="15" fill="url(#panel)" stroke="#514446" stroke-width="2"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="34" y="38" fill="#f6c279" font-size="17" font-weight="700" letter-spacing="2">01 / QUESTION</text>
    <text x="33" y="83" fill="#f5f0e8" font-family="Georgia,Times New Roman,serif" font-size="38">Where’s the workshop spare key?</text>
    <path d="M36 105v22h28" fill="none" stroke="#ad7857" stroke-width="2"/>
    <circle cx="36" cy="105" r="3.5" fill="#f6c279"/>
    <rect x="69" y="106" width="857" height="107" rx="10" fill="url(#quote)" stroke="#8e654f" stroke-width="1.5"/>
    <text x="92" y="139" fill="#f6c279" font-size="17" font-weight="700" letter-spacing="2">02 / EXACT PASSAGE</text>
    <text x="92" y="183" fill="#f5f0e8" font-family="Georgia,Times New Roman,serif" font-size="30">“After hours, the workshop spare key is in <tspan fill="#f6c279">locker 14.</tspan>”</text>
    <rect x="70" y="231" width="856" height="39" rx="6" fill="#16151a" stroke="#514446"/>
    <path d="M88 249l5 5 9-11" fill="none" stroke="#f6c279" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="257" fill="#f6c279" font-weight="700" font-size="19">Citation reopened</text>
    <text x="335" y="257" fill="#ddd0c6" font-size="20">workshop.md</text>
    <text x="509" y="257" fill="#bcaea5" font-size="19">rev 138222d1c030</text>
    <text x="732" y="257" fill="#bcaea5" font-size="19">characters 0–52</text>
  </g>
</svg>
