<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1258" viewBox="0 0 1440 1258" role="img" aria-labelledby="title desc">
<title id="title">Full Graph RAG pipeline</title>
<desc id="desc">Indexing ingests sources, parses and chunks text with anchors, embeds text and extracts typed assertions, then publishes active evidence to SQLite. A request verifies shared access, retrieves lexical or vector seeds, walks permitted edges, and resolves active source passages. Scope is checked again before model processing and response. A custom reranker can refine candidates. Evidence can be returned directly or used to generate a cited answer. Neptune is an optional opaque projection. pgvector and permission-scoped community reports require integrations.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2b2429"/></pattern>
  <linearGradient id="band" x2="1" y2="0"><stop stop-color="#2c1d20"/><stop offset="1" stop-color="#12161b"/></linearGradient>
  <marker id="goldArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#f6c279" stroke-width="1.3"/></marker>
  <marker id="silverArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#a0b4c3" stroke-width="1.3"/></marker>
</defs>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
