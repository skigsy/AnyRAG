  .subtitle { font-size: 24px; fill: #c0b4ae; }
  .label { font-size: 15px; font-weight: 650; letter-spacing: 2px; fill: #f6c279; }
  .silver { fill: #a0b4c3; }
  .cardTitle { font-size: 25px; font-weight: 650; fill: #f5f0e8; }
  .detail { font-size: 19px; fill: #c0b4ae; }
  .nodeTitle { font-size: 22px; font-weight: 650; fill: #f5f0e8; }
  .card { fill: #1b171b; stroke: #514446; }
  .extension { stroke: #667684; stroke-dasharray: 6 5; }
  .arrow, .optionalArrow, .wire { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .arrow { stroke: #f6c279; marker-end: url(#goldArrow); }
  .optionalArrow { stroke: #a0b4c3; stroke-dasharray: 5 5; marker-end: url(#silverArrow); }
  .wire { stroke: #514446; }
</style>
